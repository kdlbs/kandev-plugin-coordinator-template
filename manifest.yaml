id: "kandev-plugin-coordinator-template"
api_version: 2
version: "0.1.0"
display_name: "Coordinator Template"
description: "A customizable coordinator built from public managed-conversation and exact task APIs."
author: "Kandev contributors"
categories: ["tools"]

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  api_read: ["agent_profiles", "executor_profiles", "workspaces", "managed_agent_conversations", "tasks", "sessions", "interactions", "automations", "source_issues", "usage"]
  events: ["task.created", "task.updated", "task.state_changed"]
  api_write: ["tasks", "managed_agent_conversations", "managed_agent_tools", "execution", "interactions", "automations", "source_issues", "workflows"]

actions:
  - key: "instance.catalog"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "instance.list"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "instance.save"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "instance.pause"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "task.delegate"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "proposal.create"
    scope: "workspace"
    max_body_bytes: 32768
  - key: "proposal.list"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "proposal.approve"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "proposal.reject"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "proposal.reconcile"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "routine.list"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "routine.create"
    scope: "workspace"
    max_body_bytes: 32768
  - key: "routine.enable"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "routine.delete"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "watch.set"
    scope: "workspace"
    max_body_bytes: 8192
  - key: "watch.list"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "watch.reconcile"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "task.adopt"
    scope: "workspace"
    max_body_bytes: 8192
  - key: "task.release"
    scope: "workspace"
    max_body_bytes: 8192
  - key: "completion.criteria"
    scope: "workspace"
    max_body_bytes: 32768
  - key: "completion.evidence"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "issue.capabilities"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "issue.comment"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "issue.transition"
    scope: "workspace"
    max_body_bytes: 8192
  - key: "issue.writes.list"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "issue.write.retry"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "workspace.admin.catalog"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "workspace.admin.apply"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "outcome.report"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "outcome.list"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "task.status"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "conversation.status"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "conversation.inputs"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "conversation.enqueue"
    scope: "workspace"
    max_body_bytes: 65536
  - key: "conversation.cancel"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "conversation.pause"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "conversation.recover"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "conversation.permission-response"
    scope: "workspace"
    max_body_bytes: 8192
  - key: "conversation.clarification-response"
    scope: "workspace"
    max_body_bytes: 16384

agent_tools:
  - name: coordinator_create_task
    description: Creates one task through the Host exact API for the managed conversation's instance_key.
    surfaces: [managed-conversation]
    input_schema:
      type: object
      additionalProperties: false
      required: [instance_key, title, description, request_id]
      properties:
        instance_key:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        priority:
          type: string
          enum: [low, normal, high, urgent]
        request_id:
          type: string
          minLength: 1
          maxLength: 128
    output_schema:
      type: object
      additionalProperties: true
    annotations:
      destructive_hint: true
      idempotent_hint: true
  - name: coordinator_remember
    description: Saves a namespaced memory entry for the managed conversation's instance_key.
    surfaces: [managed-conversation]
    input_schema:
      type: object
      additionalProperties: false
      required: [instance_key, key, value]
      properties:
        instance_key:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        key:
          type: string
          minLength: 1
          maxLength: 128
        value:
          type: string
          maxLength: 4096
    output_schema:
      type: object
      additionalProperties: true
    annotations:
      destructive_hint: false
      idempotent_hint: true
  - name: coordinator_recall
    description: Reads a namespaced memory entry for the managed conversation's instance_key.
    surfaces: [managed-conversation]
    input_schema:
      type: object
      additionalProperties: false
      required: [instance_key, key]
      properties:
        instance_key:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        key:
          type: string
          minLength: 1
          maxLength: 128
    output_schema:
      type: object
      additionalProperties: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true

ui:
  bundle: "/ui/bundle.js"
